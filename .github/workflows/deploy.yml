name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # data commits are pushed by the bot token, which does not trigger "push" workflows
  workflow_run:
    workflows: ["Update syllabus data", "Extract graduation requirements"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: pip install -q pdfplumber pypdf jsonschema pytest
      - name: Python unit tests (scraper / requirements / validator)
        run: python -m pytest -q tests
      - name: Validate data
        run: python scripts/validate_data.py
      - run: npm ci
      - name: Frontend unit tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  deploy:
    # Publishes dist/ to the gh-pages branch (GitHub turns Pages on for that branch automatically).
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Push to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
