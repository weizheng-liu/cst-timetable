name: Update syllabus data

on:
  schedule:
    # 学期開始前に自動更新 (UTC): 4月1日 / 9月15日 03:00 JST
    - cron: "0 18 31 3 *"
    - cron: "0 18 14 9 *"
  workflow_dispatch:
    inputs:
      dept:
        description: "学科コード (09) / カンマ区切り / all"
        default: "all"
      year:
        description: "開講年度 (空欄で自動)"
        default: ""
      dump_fixtures:
        description: "テスト用 fixture を保存する時間割CD (カンマ区切り, 任意)"
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore HTTP cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/syllabus
          key: syllabus-${{ github.run_id }}
          restore-keys: syllabus-
      - name: Scrape
        run: |
          ARGS="--dept ${{ inputs.dept || 'all' }}"
          if [ -n "${{ inputs.year }}" ]; then ARGS="$ARGS --year ${{ inputs.year }}"; fi
          if [ -n "${{ inputs.dump_fixtures }}" ]; then ARGS="$ARGS --dump-fixtures ${{ inputs.dump_fixtures }}"; fi
          python scripts/scrape_syllabus.py $ARGS
      # 検証が失敗しても次回の再実行が速いようにキャッシュは必ず保存する
      - name: Save HTTP cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/syllabus
          key: syllabus-${{ github.run_id }}
      - name: Validate
        run: |
          pip install -q jsonschema
          python scripts/validate_data.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data public/data tests/fixtures; do if [ -e "$p" ]; then git add "$p"; fi; done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: update syllabus (${{ inputs.dept || 'all' }})"
          git pull --rebase origin ${{ github.ref_name }}
          git push
